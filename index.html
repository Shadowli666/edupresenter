<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduPresenter — Organizador de Clases</title>
    <!-- Tailwind (Play CDN) copiado a public/vendor junto con la fuente Inter, para que
         las diapositivas se vean igual sin internet cuando se sirven desde el hotspot.
         El bundle local incluye el plugin typography (`prose*`). -->
    <script src="/vendor/tailwind.js"></script>
    <link href="/vendor/fonts.css" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
        overflow-x: hidden; /* Prevent horizontal scroll from animations */
      }
      /* Custom scrollbar for cleaner look */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }

      /* Slide Transitions */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none; /* Reset transform to avoid sticky issues */
        }
      }
      .animate-fade-in {
        animation: fadeIn 0.4s ease-out forwards;
      }

      /* Contraste: dentro de cajas oscuras/de color, la negrita y los titulos
         heredan el color del fondo en vez del color oscuro por defecto de `prose`. */
      .prose strong, .prose b,
      .prose h1, .prose h2, .prose h3, .prose h4, .prose h5, .prose h6,
      .prose ul > li::marker, .prose ol > li::marker {
        color: inherit;
      }

      /* Diagramas mermaid: mermaid inserta el SVG con su propio `max-width` en px,
         que lo deja diminuto dentro del contenedor. Estas reglas lo escalan al
         ancho disponible y le reservan una altura mínima legible. */
      .mermaid {
        width: 100%;
        flex: 1 1 auto;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 340px;
        overflow: visible;
      }
      .mermaid svg {
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        min-height: 320px;
        /* Tope de altura: los diagramas verticales (graph TB) se agrandarían tanto
           que no cabrían en pantalla. Al limitar la altura, el SVG encaja el
           contenido completo (preserveAspectRatio) sin deformarlo. */
        max-height: 58vh;
      }
      /* Red de seguridad: si un rótulo quedara algo más ancho que su caja,
         preferimos que se vea completo antes que recortado. */
      .mermaid foreignObject {
        overflow: visible;
      }

      /* --- Interactivos declarativos (lib/enhance.ts) --- */
      .edup-hidden { display: none !important; }
      .edup-reveal-hint {
        position: fixed; right: 1.25rem; bottom: 7rem; z-index: 40;
        background: #0f172a; color: #fff; font-size: 0.8rem; font-weight: 700;
        padding: 0.6rem 1rem; border-radius: 9999px; box-shadow: 0 8px 24px rgba(15,23,42,.25);
      }
      .edup-reveal-hint:disabled { background: #059669; }
      .edup-copy {
        position: absolute; top: 0.5rem; right: 0.5rem; font-size: 0.7rem; font-weight: 700;
        background: rgba(255,255,255,.12); color: #e2e8f0; border: 1px solid rgba(255,255,255,.2);
        border-radius: 0.4rem; padding: 0.15rem 0.55rem;
      }
      .edup-copy:hover { background: rgba(255,255,255,.25); }
      .edup-tabbar { display: flex; gap: 0.25rem; border-bottom: 2px solid #e2e8f0; margin-bottom: 1rem; flex-wrap: wrap; }
      .edup-tabbar button {
        padding: 0.5rem 1rem; font-weight: 700; font-size: 0.875rem; color: #64748b;
        border-bottom: 3px solid transparent; margin-bottom: -2px;
      }
      .edup-tabbar button.active { color: #1d4ed8; border-bottom-color: #2563eb; }
      [data-quiz] [data-option] {
        display: block; width: 100%; text-align: left; margin: 0.4rem 0; padding: 0.6rem 0.9rem;
        border: 2px solid #e2e8f0; border-radius: 0.75rem; background: #fff; font-size: 0.9rem;
      }
      [data-quiz] [data-option]:not([disabled]):hover { border-color: #60a5fa; background: #eff6ff; }
      [data-quiz] .edup-ok { border-color: #10b981; background: #ecfdf5; color: #065f46; font-weight: 700; }
      [data-quiz] .edup-bad { border-color: #ef4444; background: #fef2f2; color: #991b1b; }

      /* --- Diagramas PELE: <div data-diagram> (lib/diagram.ts) ---
         Tema por variables CSS: paleta slate/blue de las diapositivas y la misma pila
         de fuentes LOCALES que lib/mermaid.ts (PELE mide y dibuja con la misma fuente). */
      [data-diagram] {
        --pele-bg: #ffffff;
        --pele-fg: #0f172a;
        --pele-muted: #64748b;
        --pele-line: #475569;
        --pele-surface: #f8fafc;
        --pele-surface-alt: #f1f5f9;
        --pele-border: #cbd5e1;
        --pele-accent: #2563eb;
        --pele-font: Arial, Helvetica, sans-serif;
        --pele-font-mono: ui-monospace, monospace;
        --pele-radius: 8px;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 12rem;
        margin: 1rem 0;
      }
      [data-diagram] svg.pele {
        width: 100%;
        max-width: 100%;
        height: auto;
        max-height: 42vh; /* el diagrama y el texto de la diapositiva deben caber en pantalla */
      }
      /* Antes de dibujar (o si PELE no carga) el código se ve discreto, no como contenido. */
      [data-diagram]:not([data-diagram-state]) {
        display: block; white-space: pre-wrap; font: 0.75rem/1.4 ui-monospace, monospace; color: #94a3b8;
      }
      [data-diagram][data-diagram-state="loading"]::before {
        content: "Dibujando diagrama…"; color: #94a3b8; font-size: 0.85rem;
      }
      [data-diagram][data-diagram-state="error"] { display: block; }
      .edup-diagram-msg {
        margin: 0 0 0.5rem; padding: 0.5rem 0.75rem; font-size: 0.85rem; font-weight: 700;
        color: #92400e; background: #fffbeb; border: 1px solid #fde68a; border-radius: 0.5rem;
      }
      .edup-diagram-src { margin: 0; font-size: 0.8rem; overflow: auto; }

      /* Pasos (data-steps): lo oculto no ocupa clics y vuelve con fundido. */
      .edup-step-hidden { opacity: 0; pointer-events: none; }
      /* Foco en el grupo recién mostrado (se mueve al siguiente paso). */
      .pele-node.edup-current > :not(text) { stroke: var(--pele-accent); stroke-width: 2.5px; }
      .pele-edge.edup-current > path:not(.pele-marker) { stroke: var(--pele-accent); stroke-width: 2.5px; }
      .pele-edge.edup-current > .pele-marker { fill: var(--pele-accent); }
      .edup-flow.edup-step-hidden > path:not(.pele-marker) { animation: none; }

      /* Movimiento: solo en pantalla y si el usuario no pidió reducirlo. */
      @media screen and (prefers-reduced-motion: no-preference) {
        /* La transición solo vale al MOSTRAR: ocultar es instantáneo, así el SVG recién
           dibujado (opacidad 1) no hace un fundido 1 -> 0 antes de quedar oculto. */
        .edup-step:not(.edup-step-hidden) { transition: opacity 0.45s ease; }
        .edup-step > * { transition: stroke 0.3s ease, stroke-width 0.3s ease, fill 0.3s ease; }
        .edup-draw { stroke-dasharray: var(--edup-len); stroke-dashoffset: 0; }
        .edup-step:not(.edup-step-hidden) .edup-draw { transition: stroke-dashoffset 0.6s ease; }
        .edup-step-hidden .edup-draw { stroke-dashoffset: var(--edup-len); }
        .edup-flow > path:not(.pele-marker) { stroke-dasharray: 8 6; animation: edup-flow 1s linear infinite; }
        @keyframes edup-flow { to { stroke-dashoffset: -14; } }
      }
      @media print, (prefers-reduced-motion: reduce) {
        .edup-step, .edup-step > *, .edup-draw { transition: none !important; }
        .edup-flow > path { animation: none !important; }
      }

      @media print {
        .edup-copy, .edup-reveal-hint, .edup-tabbar { display: none !important; }
      }

      /* --- Exportación a PDF (Exportar PDF) ---
         Cada diapositiva es una hoja A4 horizontal de tamaño FIJO (277 x 189 mm,
         el área útil con márgenes de 10 mm). PdfExport mide el contenido de cada
         una con exactamente este layout y le aplica `zoom` para que quepa entera:
         así nunca se parte entre dos hojas ni deja la mitad vacía.
         En pantalla el contenedor queda fuera de vista, pero con layout (no
         display:none) porque Mermaid necesita medir el texto de sus rótulos. */
      #pdf-export-root {
        position: absolute;
        left: -99999px;
        top: 0;
        width: 277mm;
        font-size: 13px;
        line-height: 1.35;
      }
      .pdf-page {
        box-sizing: border-box;
        position: relative;
        width: 277mm;
        height: 189mm; /* 1 mm menos que el área útil: evita hojas en blanco por redondeo */
        padding: 0 0 10mm 0;
        overflow: hidden;
        background: #fff;
        break-after: page;
        page-break-after: always;
        break-inside: avoid;
      }
      .pdf-page:last-child {
        break-after: auto;
        page-break-after: auto;
      }
      .pdf-cover {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-bottom: 0;
      }
      .pdf-footnote {
        position: absolute;
        left: 0;
        bottom: 2mm;
        font-size: 10px;
        font-family: ui-monospace, monospace;
        color: #94a3b8;
      }
      #pdf-export-root .mermaid {
        min-height: 0;
      }
      #pdf-export-root .mermaid svg {
        max-height: 105mm !important;
        min-height: 0 !important;
      }
      #pdf-export-root [data-diagram] { min-height: 0; margin: 0.5rem 0; }
      #pdf-export-root [data-diagram] svg.pele { max-height: 105mm; }

      /* En impresión: fondo y colores se conservan. */
      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      @media print {
        @page {
          size: A4 landscape;
          margin: 10mm;
        }
        html, body {
          background: #fff !important;
          height: auto !important;
          overflow: visible !important;
        }
        /* display: none (no visibility): el texto oculto por visibility sigue
           reservando espacio y generaba páginas en blanco. */
        body > *:not(#pdf-export-root) {
          display: none !important;
        }
        #pdf-export-root {
          display: block !important;
          position: static !important;
          left: auto !important;
        }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
