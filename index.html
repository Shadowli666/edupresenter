<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduPresenter — Organizador de Clases</title>
    <!-- Tailwind (Play CDN). El plugin typography habilita las clases `prose*` usadas en SlideViewer y en los módulos. -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
        overflow-x: hidden; /* Prevent horizontal scroll from animations */
      }
      /* Custom scrollbar for cleaner look */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }

      /* Slide Transitions */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none; /* Reset transform to avoid sticky issues */
        }
      }
      .animate-fade-in {
        animation: fadeIn 0.4s ease-out forwards;
      }

      /* Contraste: dentro de cajas oscuras/de color, la negrita y los titulos
         heredan el color del fondo en vez del color oscuro por defecto de `prose`. */
      .prose strong, .prose b,
      .prose h1, .prose h2, .prose h3, .prose h4, .prose h5, .prose h6,
      .prose ul > li::marker, .prose ol > li::marker {
        color: inherit;
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
