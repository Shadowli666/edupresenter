name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependencias
        run: npm ci

      # Las notas del docente y las evaluaciones salen cifradas. Los códigos viven en
      # el secreto UNLOCK_CODES del repositorio (JSON: {"notas": "...", "eval-corte-1": "..."});
      # nunca en el código fuente. Sin secreto, ese contenido queda "no disponible".
      - name: Build
        run: npm run build
        env:
          UNLOCK_CODES: ${{ secrets.UNLOCK_CODES }}

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
